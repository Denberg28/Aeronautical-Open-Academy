name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Denberg28/Aeronautical-Open-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AOA_TEST_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Source and content checks
        run: |
          sh tools/core_checks.sh
          python3 tools/project_checks.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          npm test --prefix server
      - name: Android build and lint
        run: sh gradlew --no-daemon :app:coreChecks :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
      - name: Package build evidence
        run: |
          mkdir -p out/build-evidence
          printf '%s\n' "$GITHUB_SHA" > out/build-evidence/source-commit.txt
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > out/build-evidence/SHA256SUMS.txt
          cp docs/KNOWN_ISSUES.md out/build-evidence/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > out/build-evidence/debug-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > out/build-evidence/debug-package.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('out/build-evidence/verification.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_NUMBER'],'android_build_lint_unit_tests':'PASS','core_catalog_backend_checks':'PASS','device':'NOT TESTED','live_backend_and_drive':'BLOCKED','stable':'BLOCKED','tier':'development test APK'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: academy-test-build-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*unsigned.apk
            app/build/reports/lint-results-*.html
            out/build-evidence/
          if-no-files-found: error
          retention-days: 14
  publish-test:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Denberg28/Aeronautical-Open-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: academy-test-build-${{ github.sha }}
          path: out/verified
      - name: Prepare unique development test release
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r"versionName '([^']+)'",Path('app/build.gradle').read_text()).group(1)
          assert re.fullmatch(r'\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+',version), 'Test publication requires a prerelease app version'
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('RELEASE_TAG=v'+version+'-test.'+os.environ['GITHUB_RUN_NUMBER']+'\n')
          PY
      - name: Collect versioned test release files
        run: |
          mkdir -p out/release
          cp "$(find out/verified -name app-debug.apk -print -quit)" "out/release/Aeronautical-Open-Academy-$RELEASE_TAG.apk"
          cp "$(find out/verified -name debug-signature.txt -print -quit)" out/release/
          cp "$(find out/verified -name debug-package.txt -print -quit)" out/release/
          cp "$(find out/verified -name source-commit.txt -print -quit)" out/release/
          cp "$(find out/verified -name verification.json -print -quit)" out/release/
          cp docs/KNOWN_ISSUES.md out/release/
          (cd out/release && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish authorized public test APK
        run: gh release create "$RELEASE_TAG" out/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Academy $RELEASE_TAG - development test APK" --notes-file docs/RELEASE_NOTES.md
