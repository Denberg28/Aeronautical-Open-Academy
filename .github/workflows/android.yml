name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Denberg28/Aeronautical-Open-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Source and content checks
        run: |
          sh tools/core_checks.sh
          python3 tools/project_checks.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          npm test --prefix server
      - name: Android build and lint
        run: sh gradlew --no-daemon :app:coreChecks :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
      - name: Package build evidence
        run: |
          mkdir -p out/build-evidence
          printf '%s\n' "$GITHUB_SHA" > out/build-evidence/source-commit.txt
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > out/build-evidence/SHA256SUMS.txt
          cp docs/KNOWN_ISSUES.md out/build-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: academy-test-build-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*unsigned.apk
            app/build/reports/lint-results-*.html
            out/build-evidence/
          if-no-files-found: error
          retention-days: 14
