name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Denberg28/Aeronautical-Open-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AOA_TEST_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Source and content checks
        run: |
          python3 tools/release_gate.py --test-build
          sh tools/core_checks.sh
          python3 tools/project_checks.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          npm test --prefix server
      - name: Android build and lint
        run: sh gradlew --no-daemon :app:coreChecks :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
      - name: Package build evidence
        run: |
          mkdir -p out/build-evidence
          printf '%s\n' "$GITHUB_SHA" > out/build-evidence/source-commit.txt
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > out/build-evidence/SHA256SUMS.txt
          cp docs/KNOWN_ISSUES.md out/build-evidence/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > out/build-evidence/debug-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > out/build-evidence/debug-package.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('out/build-evidence/verification.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_NUMBER'],'android_build_lint_unit_tests':'PASS','core_catalog_backend_checks':'PASS','device':'NOT TESTED','live_backend':'BLOCKED','external_provider_access':'NOT TESTED','optional_drive_adapter':'NOT TESTED','stable':'BLOCKED','tier':'development test APK'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: academy-test-build-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*unsigned.apk
            app/build/reports/lint-results-*.html
            out/build-evidence/
          if-no-files-found: error
          retention-days: 14
  device-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AOA_TEST_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android subject and assessment smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: sh tools/device_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-device-smoke-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            out/device-smoke/
          retention-days: 14
  publish-test:
    needs: [verify, device-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Denberg28/Aeronautical-Open-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: academy-test-build-${{ github.sha }}
          path: out/verified
      - uses: actions/download-artifact@v4
        with:
          name: academy-device-smoke-${{ github.sha }}
          path: out/device-verified
      - name: Prepare unique development test release
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r"versionName '([^']+)'",Path('app/build.gradle').read_text()).group(1)
          assert re.fullmatch(r'\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+',version), 'Test publication requires a prerelease app version'
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('RELEASE_TAG=v'+version+'-test.'+os.environ['GITHUB_RUN_NUMBER']+'\n')
          PY
      - name: Collect versioned test release files
        run: |
          mkdir -p out/release
          cp "$(find out/verified -name app-debug.apk -print -quit)" "out/release/Aeronautical-Open-Academy-$RELEASE_TAG.apk"
          cp "$(find out/verified -name debug-signature.txt -print -quit)" out/release/
          cp "$(find out/verified -name debug-package.txt -print -quit)" out/release/
          cp "$(find out/verified -name source-commit.txt -print -quit)" out/release/
          cp "$(find out/verified -name verification.json -print -quit)" out/release/
          cp docs/KNOWN_ISSUES.md out/release/
          git archive --format=zip --output="out/release/Aeronautical-Open-Academy-$RELEASE_TAG-source.zip" "$GITHUB_SHA"
          cp docs/SECURITY_RELEASE.md out/release/
          cp docs/FORMS_RELEASE.md out/release/
          find out/device-verified -name '*.png' -exec cp {} out/release/ \;
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('out/release')
          for image in ('subjects.png','header-large-font.png','subject-actions.png','quiz-result.png','pinned-subject.png','reader-paragraphs.png'):
              assert (root/image).is_file(), 'Missing successful emulator evidence: '+image
          evidence=root/'verification.json'
          result=json.loads(evidence.read_text())
          result['emulator_smoke']='PASS: Android 35, 360 dp, header at 200% fonts, Read, quiz/sign-in/submit/result/review, pinned subject/progress during scroll, paragraph spacing/link preservation'
          evidence.write_text(json.dumps(result,indent=2))
          files=sorted(p for p in root.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - name: Publish authorized public test APK
        run: gh release create "$RELEASE_TAG" out/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Academy $RELEASE_TAG - development test APK" --notes-file docs/RELEASE_NOTES.md
