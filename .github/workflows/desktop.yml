name: Windows desktop release verification
on:
  push:
    paths: ["desktop/**", "server/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "server/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm audit --prefix desktop --audit-level=high
      - run: npm test --prefix server
      - run: npm test --prefix desktop
      - name: Native Electron single-page workflows
        run: npm run test:ui --prefix desktop
      - name: Native IPC startup smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './desktop/node_modules/electron/dist/electron.exe' -ArgumentList @('desktop','--smoke-test') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Electron smoke test failed' }
          $result = Get-Content (Join-Path $env:TEMP 'academy-smoke-result.json') | ConvertFrom-Json
          if ($result.role -ne 'instructor' -or !$result.bridge) { throw 'Missing IPC evidence' }
      - run: npm run package:win --prefix desktop
      - run: node desktop/tools/verify-package.mjs
      - name: Packaged Windows launch and IPC
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:TEMP 'academy-smoke-result.json'
          Remove-Item $resultPath -ErrorAction SilentlyContinue
          $exe = (Get-ChildItem out/Academy-PC-*/Academy.exe).FullName
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged startup timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged startup failed' }
          $result = Get-Content $resultPath | ConvertFrom-Json
          if ($result.role -ne 'instructor' -or !$result.bridge) { throw 'Missing packaged IPC evidence' }
      - name: Package verified desktop release
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $channel = if ($version -match '-') { 'prerelease' } else { 'stable' }
          $evidence = @{commit=$env:GITHUB_SHA; version=$version; windows_runner='windows-2025'; desktop_tests='PASS'; native_ui_workflows='PASS'; packaged_startup_ipc='PASS'; package_integrity='PASS'; backend_regression='PASS'; dependency_audit='PASS'; real_provider_sign_in='NOT TESTED'; physical_windows_accessibility='NOT TESTED'; github_release_channel=$channel; physical_acceptance='NOT TESTED'; production_readiness='NOT CLAIMED'; tier='Windows desktop build'}
          $evidence | ConvertTo-Json | Set-Content out/windows-verification.json
          Compress-Archive -Path "out/Academy-PC-$version-win32-x64",out/windows-verification.json -DestinationPath "out/Aeronautical-Open-Academy-PC-v$version-Windows-x64.zip"
          Get-ChildItem out/*.zip | Get-FileHash -Algorithm SHA256 | Format-List | Out-File out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Academy-PC-Windows-${{ github.sha }}
          path: |
            out/*.zip
            out/windows-verification.json
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Academy-PC-QA-${{ github.sha }}
          path: out/desktop-qa/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/desktop/compact-controls-grading' && github.repository == 'Denberg28/Aeronautical-Open-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require paired Android verification of this exact source
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']
          for attempt in range(120):
              runs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=20']))['workflow_runs']
              android=[r for r in runs if r['path']=='.github/workflows/android.yml' and r['head_sha']==sha]
              if android and android[0]['status']=='completed':
                  assert android[0]['conclusion']=='success', 'Android compatibility gate failed'
                  break
              time.sleep(10)
          else: raise AssertionError('Android compatibility gate timed out')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Academy-PC-Windows-${{ github.sha }}
          path: out/verified
      - name: Verify the original Windows candidate artifact
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,zipfile
          from pathlib import Path
          version=json.loads(Path('desktop/package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+-(rc|alpha|beta)\.\d+',version), 'Only prereleases are authorized'
          root=Path('out/verified'); package=root/f'Aeronautical-Open-Academy-PC-v{version}-Windows-x64.zip'
          evidence=json.loads((root/'windows-verification.json').read_text(encoding='utf-8-sig'))
          assert evidence['commit']==os.environ['GITHUB_SHA'] and evidence['version']==version
          for check in ('desktop_tests','native_ui_workflows','packaged_startup_ipc','package_integrity','backend_regression','dependency_audit'):
              assert evidence[check]=='PASS', check
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None
              prefix=f'Academy-PC-{version}-win32-x64/'
              manifest=json.loads(archive.read(prefix+'package-manifest.json'))
              assert manifest['source']==os.environ['GITHUB_SHA'] and manifest['version']==version
              for name,digest in manifest['sha256'].items():
                  assert '..' not in Path(name).parts and not Path(name).is_absolute()
                  assert hashlib.sha256(archive.read(prefix+name)).hexdigest()==digest, name
          digest=hashlib.sha256(package.read_bytes()).hexdigest()
          (root/'SHA256SUMS.txt').write_text(digest+'  '+package.name+'\n')
          (root/'source-commit.txt').write_text(os.environ['GITHUB_SHA']+'\n')
          (root/'release-verification.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'windows_native_ui_package_audit':'PASS','paired_android':'PASS','package_sha256':digest,'physical_windows_accessibility':'NOT TESTED','organization_deployment':'NOT TESTED','tier':'unsigned Windows x64 prerelease'},indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write(f'RELEASE_TAG=pc-v{version}\n')
          PY
      - name: Publish the verified Windows candidate
        run: |
          test -n "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" out/verified/*.zip out/verified/SHA256SUMS.txt out/verified/source-commit.txt out/verified/windows-verification.json out/verified/release-verification.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Academy PC $RELEASE_TAG — forms and reading layout" --notes-file docs/DESKTOP_RELEASE_NOTES.md
