name: Streamlit verification
on:
  push:
    paths: ['web/**', 'streamlit_app.py', 'requirements.txt', '.streamlit/**', 'server/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'streamlit_app.py', 'requirements.txt', '.streamlit/**', 'server/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s web/tests -p 'test_*.py' -v
      - run: npm test --prefix server
