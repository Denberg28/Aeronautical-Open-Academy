plugins { id 'com.android.application' }

android {
    namespace 'org.aeronautical.openacademy'
    compileSdk 35
    defaultConfig {
        applicationId 'org.aeronautical.openacademy'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('AOA_TEST_BUILD_NUMBER') ? 50000 + Integer.parseInt(System.getenv('AOA_TEST_BUILD_NUMBER')) : 5)
        versionName '0.5.0-alpha.1'
        buildConfigField 'String', 'SOURCE_COMMIT', '"' + (System.getenv('GITHUB_SHA') ?: 'local') + '"'
    }
    buildFeatures { buildConfig true }
    sourceSets { test.resources.srcDir 'src/main/assets' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('AOA_KEYSTORE_PATH')) {
                storeFile file(System.getenv('AOA_KEYSTORE_PATH'))
                storePassword System.getenv('AOA_STORE_PASSWORD')
                keyAlias System.getenv('AOA_KEY_ALIAS')
                keyPassword System.getenv('AOA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.test'; versionNameSuffix '-test.' + (System.getenv('AOA_TEST_BUILD_NUMBER') ?: 'local') }
        release {
            minifyEnabled false
            if (System.getenv('AOA_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def compileCoreChecks = tasks.register('compileCoreChecks', JavaCompile) {
    source fileTree('src/main/java/org/aeronautical/openacademy/core')
    source rootProject.file('tests/CoreChecks.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('core-checks')
    options.release = 17
}
tasks.register('coreChecks', JavaExec) {
    dependsOn compileCoreChecks
    classpath = files(layout.buildDirectory.dir('core-checks'))
    mainClass = 'CoreChecks'
}
