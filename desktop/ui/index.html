<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'"
    />
    <title>Aeronautical Academy Repository</title>
    <link rel="stylesheet" href="style.css" />
    <script src="reader.js" defer></script>
    <script src="schedule.js" defer></script>
    <script src="presenter.js" defer></script>
    <script src="editor.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="app" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="signin" aria-labelledby="signin-title">
      <div class="login-brand">
        <span class="brand-mark">A</span
        ><span>AERONAUTICAL<br />ACADEMY REPOSITORY</span>
      </div>
      <h1 id="signin-title">Sign in</h1>
      <form id="login-form">
        <label
          >Workspace<select name="mode" id="workspace">
            <option value="local">Local test workspace</option>
            <option value="organization">Organization server</option>
          </select></label
        >
        <label id="origin-label" hidden
          >Server address<input
            name="origin"
            placeholder="https://academy.your-organization.edu"
            type="url"
        /></label>
        <label
          >Username or email<input
            name="username"
            autocomplete="username"
            value="instructor"
            required
            maxlength="254"
        /></label>
        <label
          >Password<span class="password-field"
            ><input
              name="password"
              type="password"
              autocomplete="current-password"
              value="instructor"
              required
              maxlength="128"
            /><button
              type="button"
              id="toggle-password"
              class="quiet"
              aria-pressed="false"
            >
              Show
            </button></span
          ></label
        >
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary wide" type="submit">
          Sign in <span aria-hidden="true">→</span>
        </button>
      </form>
      <div id="demo-hint">
        <div class="demo-roles">
          <button type="button" data-demo="admin">Admin</button
          ><button type="button" data-demo="instructor">Instructor</button>
        </div>
      </div>
    </dialog>
    <dialog id="confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text" class="muted"></p>
      <div class="form-actions">
        <button id="confirm-no">Cancel</button
        ><button id="confirm-yes" class="primary">Continue</button>
      </div>
    </dialog>
    <dialog
      id="presenter-dialog"
      class="presenter-dialog"
      aria-label="Instructor-guided presentation"
    ></dialog>
  </body>
</html>
